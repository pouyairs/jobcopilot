<!DOCTYPE html>

<html
    lang="{{ ui_lang }}"
    dir="{% if ui_lang == 'fa' %}rtl{% else %}ltr{% endif %}"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            {{ t.app_name }}
        {% endblock %}
    </title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        nav {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .nav-container {
            max-width: 1100px;
            margin: auto;
            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            color: #111827;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-links a {
            color: #374151;
            text-decoration: none;
        }

        .container {
            width: 100%;
            max-width: 1000px;

            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 14px;

            padding: 28px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.04);
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 11px 12px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 15px;

            margin-bottom: 17px;

            background: white;
        }

        input[type="checkbox"] {
            width: auto;
            margin: 0 8px;
        }

        textarea {
            resize: vertical;
        }

        button,
        .btn {

            display: inline-block;

            border: 0;
            border-radius: 8px;

            padding: 11px 18px;

            background: #111827;
            color: white;

            font-size: 15px;

            cursor: pointer;

            text-decoration: none;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .language-links a {
            text-decoration: none;
            font-weight: bold;

            color: #4b5563;

            margin: 0 4px;
        }

        .success {
            padding: 12px;

            border-radius: 8px;

            background: #ecfdf5;

            margin-bottom: 20px;
        }

        .errorlist {
            color: #b91c1c;
        }

        .auth-box {
            max-width: 500px;
            margin: 60px auto;
        }

        .logout-form {
            display: inline;
        }

        .logout-form button {

            background: none;
            color: #374151;

            padding: 0;
        }

        @media (max-width: 700px) {

            .nav-container {
                flex-direction: column;
                padding: 15px;
                gap: 12px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                margin-top: 25px;
            }
        }

    </style>

</head>


<body>


<nav>

    <div class="nav-container">

        <a
            class="brand"
            href="{% url 'home' %}"
        >
            {{ t.app_name }}
        </a>


        <div class="nav-links">

            {% if user.is_authenticated %}

                <a href="{% url 'dashboard' %}">
                    {{ t.dashboard }}
                </a>

                <a href="{% url 'profile' %}">
                    {{ t.profile }}
                </a>
                <a href="{% url 'analyze_job' %}">
    {{ t.analyze_job }}
</a>

<a href="{% url 'applications' %}">
    {{ t.applications }}
</a>

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    class="logout-form"
                >

                    {% csrf_token %}

                    <button type="submit">
                        {{ t.logout }}
                    </button>

                </form>

            {% else %}

                <a href="{% url 'login' %}">
                    {{ t.login }}
                </a>

                <a href="{% url 'register' %}">
                    {{ t.register }}
                </a>

            {% endif %}


            <div class="language-links">

                <a href="{% url 'set_language' 'en' %}">
                    EN
                </a>

                |

                <a href="{% url 'set_language' 'fa' %}">
                    FA
                </a>

            </div>

        </div>

    </div>

</nav>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


</body>

</html>
